apiVersion: nexus.kostoed.ru/v1alpha1
kind: Repository
metadata:
  name: example-docker-proxy-repo
  namespace: platform
spec:
  name: example-docker-proxy-repo
  type: docker-proxy
  online: true
  storage:
    blobStoreName: default
    strictContentTypeValidation: true
    writePolicy: ALLOW
  docker:
    httpsPort: 5447
    subdomain: example-docker-proxy
    v1Enabled: false
  proxy:
    remoteUrl: https://registry-1.docker.io/123
    contentMaxAge: 1200
    metadataMaxAge: 1210
  httpClient:
    autoBlock: true
    blocked: false
    # Вариант 1: credentials из K8s Secret (рекомендуется).
    # Secret должен содержать JSON: {"username":"...","password":"..."}
    authentication:
      type: username
      secretRef:
        name: nexus-proxy-auth
        key: example-docker-proxy-repo
    # Вариант 2: credentials inline (не рекомендуется — пароль хранится в CR).
    # authentication:
    #   type: username
    #   username: my-docker-username
    #   password: <secret>
  negativeCache:
    enabled: true
    timeToLive: 300
