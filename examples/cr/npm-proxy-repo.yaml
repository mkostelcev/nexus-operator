apiVersion: nexus.kostoed.ru/v1alpha1
kind: Repository
metadata:
  name: example-npm-proxy-repo
  namespace: platform
spec:
  name: example-npm-proxy-repo
  type: npm-proxy
  online: true
  storage:
    blobStoreName: default
    strictContentTypeValidation: true
    writePolicy: ALLOW
  proxy:
    remoteUrl: https://registry.npmjs.org/
    contentMaxAge: 1440
    metadataMaxAge: 1440
  httpClient:
    autoBlock: true
    blocked: false
    # Вариант 1: credentials из K8s Secret (рекомендуется).
    # Secret должен содержать JSON: {"username":"...","password":"..."}
    authentication:
      type: username
      secretRef:
        name: nexus-proxy-auth
        key: example-npm-proxy-repo
    # Вариант 2: credentials inline (не рекомендуется — пароль хранится в CR).
    # authentication:
    #   type: username
    #   username: user
    #   password: <secret>
  negativeCache:
    enabled: true
    timeToLive: 300
