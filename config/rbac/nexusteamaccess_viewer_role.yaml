# permissions for end users to view nexusteamaccesses.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: nexus-operator-deepseek
    app.kubernetes.io/managed-by: kustomize
  name: nexusteamaccess-viewer-role
rules:
- apiGroups:
  - nexus.kostoed.ru
  resources:
  - nexusteamaccesses
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - nexus.kostoed.ru
  resources:
  - nexusteamaccesses/status
  verbs:
  - get
