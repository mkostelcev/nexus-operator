# permissions for end users to edit contentselectors.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: nexus-operator-deepseek
    app.kubernetes.io/managed-by: kustomize
  name: contentselector-editor-role
rules:
- apiGroups:
  - nexus.kostoed.ru
  resources:
  - contentselectors
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - nexus.kostoed.ru
  resources:
  - contentselectors/status
  verbs:
  - get
