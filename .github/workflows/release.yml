name: Release

on:
  push:
    tags:
      - 'v*'

env:
  GO_VERSION: '1.23.3'
  BINARY_NAME: nexus-operator
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  binaries:
    name: Бинарники
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Сборка
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          OUT="${BINARY_NAME}_${GITHUB_REF_NAME}_${GOOS}_${GOARCH}"
          go build -trimpath -ldflags "-s -w -X main.Version=${GITHUB_REF_NAME}" -o "${OUT}" main.go
          tar -czf "${OUT}.tar.gz" "${OUT}"
          sha256sum "${OUT}.tar.gz" > "${OUT}.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            ${{ env.BINARY_NAME }}_*.tar.gz
            ${{ env.BINARY_NAME }}_*.tar.gz.sha256
          retention-days: 1

  image:
    name: Образ
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release:
    name: Релиз
    runs-on: ubuntu-latest
    needs: [binaries, image]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          pattern: bin-*
          merge-multiple: true

      - name: Описание релиза
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#v}"
          # раздел текущей версии из CHANGELOG.md, если он там есть
          awk -v ver="$VER" '/^## Версия / {if (block) exit; block=($0 ~ "^## Версия "ver"$")} block' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "## Версия ${VER}" > notes.md
          fi
          {
            echo
            echo "### Образ"
            echo
            echo '```sh'
            echo "docker pull ${REGISTRY}/${IMAGE_NAME}:${GITHUB_REF_NAME}"
            echo '```'
          } >> notes.md
          cat notes.md

      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: notes.md
          files: |
            artifacts/*
