# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

env:
  GO_VERSION: '1.23.3'
  GOLANGCI_LINT_VERSION: 'v1.62.0'

on:
  push:
    branches: [ "master", "feature/**" ]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [ "master" ]

jobs:

  lint:
      # Only run this on repositories in the 'mkostelcev' org, not on forks.
      if: startsWith(github.repository, 'mkostelcev/')
      runs-on: ubuntu-latest
      steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Ensure code formatting and style is consistent
        uses: golangci/golangci-lint-action@v6
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}

  build:
    runs-on: ubuntu-latest
    needs: lint
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Build
      run: go build -v ./...

  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set image tag
        run: echo "IMAGE_TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
      - name: Build and push docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/nexus-operator:${{ env.IMAGE_TAG }}

  release:
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/feature/'))
    permissions:
      contents: write
      packages: write
    runs-on: ubuntu-latest
    needs: 
      - build
      - docker
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Download git-chglog
        run: |
          GIT_CHGLOG='0.15.1'
          curl -sSL "https://github.com/git-chglog/git-chglog/releases/download/v${GIT_CHGLOG}/git-chglog_${GIT_CHGLOG}_linux_amd64.tar.gz" -o chglog.tgz
          tar -xzf chglog.tgz
          sudo mv git-chglog /usr/local/bin/

      - name: Generate CHANGELOG
        run: |
          git-chglog -o CHANGELOG.md

      - name: Build binaries (linux/amd64, linux/arm64, darwin/amd64, darwin/arm64, windows/amd64)
        run: |
          set -e
          PLATFORMS="linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64"
          for PLATFORM in $PLATFORMS; do
            GOOS=${PLATFORM%/*}
            GOARCH=${PLATFORM#*/}
            BIN_NAME="nexus-operator-${GOOS}-${GOARCH}"
            [ "$GOOS" = "windows" ] && BIN_NAME="$BIN_NAME.exe"
            env GOOS=$GOOS GOARCH=$GOARCH go build -ldflags="-s -w" -o "$BIN_NAME" .
            ARCHIVE="${BIN_NAME%.*}.tar.gz"
            tar -czf "$ARCHIVE" "$BIN_NAME"
            rm "$BIN_NAME"
          done

      - name: Build release notes
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          awk -v ver="$TAG" '/^## Версия / {if (block) exit; block=($0 ~ "## Версия "ver)} block' CHANGELOG.md > _release_changelog.md
          git-chglog --template .chglog/template.tpl -o _release_commits.md
          cat _release_changelog.md > _release_full.md
          echo "" >> _release_full.md
          cat _release_commits.md >> _release_full.md

      - name: Create GitHub Release and upload binaries
        uses: softprops/action-gh-release@v1
        with:
          files: |
            *.tar.gz
          body_path: _release_full.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
